<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | DromDost</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">🏠 DromDost</div>
    <nav class="nav-links">
        <a href="Start.html">Home</a>
        <a href="matches.html">Matches</a>
    </nav>
</header>

<div class="container profile-container">
    <h2>Complete Your Profile</h2>
    <p style="text-align:center; color:#666; margin-bottom:25px;">
        Tell us more so we can find the best roommate for you
    </p>

    <form id="Profiletype" class="profile-form">

        <select id="Profession" onchange="showProfessionFields()">
            <option value="">💼 Select Profession</option>
            <option value="student">Student</option>

            <option value="working">💻 Working Professional</option>
        </select>

        <div id="studentField" style="display:none;">
            <input type="text" id="studycourse" placeholder="📚 Course / Degree">
        </div>

        <div id="workingField" style="display:none;">
            <input type="text" id="workfield" placeholder="🏢 Work Field">
        </div>

        <input type="file" id="profilePic">

        <select id="sleep">
            <option>😴 Early Sleeper</option>
            <option>🌙 Night Owl</option>
        </select>

        <select id="study">
            <option>📖 Morning Study</option>
            <option>🌃 Night Study</option>
            <option>🔄 Random</option>
        </select>

        <input type="number" id="clean" placeholder="🧹 Cleanliness (1–5)">
        <input type="number" id="budget" placeholder="💰 Monthly Budget">

        <select id="food">
            <option>🥗 Veg</option>
            <option>🍗 Non-Veg</option>
            <option>🍽️ Both</option>
        </select>

        <select id="Gender">
            <option>🚹 Male</option>
            <option>🚺 Female</option>
            <option>⚧ Other</option>
        </select>

        <select id="language">
            <option>🗣️ Hindi</option>
            <option>🗣️ English</option>
            <option>🗣️ Both</option>
        </select>

        <button type="submit" class="btn">Save Profile</button>

    </form>
</div>

<footer>
    © 2025 DromDost
</footer>

<script src="js/app.js"></script>
</body>
</html>
